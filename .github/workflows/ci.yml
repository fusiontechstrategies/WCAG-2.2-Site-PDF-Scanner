name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Compile source
        run: python -m py_compile WCAG_Site_PDF_Scanner.py

      - name: Run offline diagnostics
        run: python WCAG_Site_PDF_Scanner.py diagnostics

      - name: Lint
        run: python -m ruff check WCAG_Site_PDF_Scanner.py

      - name: Run static security analysis
        run: python -m bandit -q -c pyproject.toml -r WCAG_Site_PDF_Scanner.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
