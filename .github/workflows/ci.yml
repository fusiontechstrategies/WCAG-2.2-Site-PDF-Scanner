name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Compile source
        run: python -m py_compile WCAG_Site_PDF_Scanner.py

      - name: Run offline diagnostics
        run: python WCAG_Site_PDF_Scanner.py diagnostics

      - name: Run core regression tests
        run: python -m unittest -v tests.test_core_regressions tests.test_adoption_assets

      - name: Lint
        run: python -m ruff check WCAG_Site_PDF_Scanner.py examples scripts tests

      - name: Run static security analysis
        run: python -m bandit -q -c pyproject.toml -r WCAG_Site_PDF_Scanner.py

  browser-regression:
    name: Browser keyboard regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run keyboard navigation regression
        run: python -m unittest -v tests.test_keyboard_playwright

  platform-regression:
    name: Platform ${{ matrix.os }} Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Compile source
        run: python -m py_compile WCAG_Site_PDF_Scanner.py

      - name: Run offline diagnostics
        run: python WCAG_Site_PDF_Scanner.py diagnostics

      - name: Run core regression tests
        run: python -m unittest -v tests.test_core_regressions tests.test_adoption_assets

      - name: Lint
        run: python -m ruff check WCAG_Site_PDF_Scanner.py examples scripts tests

      - name: Run static security analysis
        run: python -m bandit -q -c pyproject.toml -r WCAG_Site_PDF_Scanner.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off

  package-artifact:
    name: Package artifact Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_distribution.py dist

      - name: Validate wheel in an isolated environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-smoke/bin/wcag-site-pdf-scanner --version
          .wheel-smoke/bin/wcag-site-pdf-scanner diagnostics

      - name: Validate source distribution in an isolated environment
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install --disable-pip-version-check dist/*.tar.gz
          .sdist-smoke/bin/wcag-site-pdf-scanner --version
          .sdist-smoke/bin/wcag-site-pdf-scanner diagnostics

      - name: Validate local pipx installation
        env:
          PIPX_HOME: ${{ github.workspace }}/.pipx-home
          PIPX_BIN_DIR: ${{ github.workspace }}/.pipx-bin
        run: |
          python -m pipx install .
          .pipx-bin/wcag-site-pdf-scanner --version
          .pipx-bin/wcag-site-pdf-scanner diagnostics
