name: Publish package to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release identity and asset set
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$version"
          commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          test "$(gh api "repos/$GH_REPO/commits/$commit" --jq '.commit.verification.verified')" = true
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = false
          expected="$(printf '%s\n' \
            "WCAG-Site-PDF-Scanner-v${version}.py" \
            "wcag_site_pdf_scanner-${version}-py3-none-any.whl" \
            "wcag_site_pdf_scanner-${version}.tar.gz" \
            "WCAG-Site-PDF-Scanner-v${version}.spdx.json" \
            'SHA256SUMS.txt' 'release-evidence.json' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual"

      - name: Download and verify public release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets dist
          gh release download "$RELEASE_TAG" --pattern '*' --dir release-assets
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          cp release-assets/*.whl release-assets/*.tar.gz dist/
          python scripts/verify_distribution.py dist
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('release-assets')
          evidence = json.loads((root / 'release-evidence.json').read_text(encoding='utf-8'))
          tag = os.environ['RELEASE_TAG']
          version = tag[1:]
          assert evidence['tag'] == tag
          assert evidence['version'] == version
          assert evidence['source_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert set(evidence['expected_release_assets']) == {p.name for p in root.iterdir()}
          for artifact in evidence['artifacts']:
              path = root / artifact['name']
              assert path.stat().st_size == artifact['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact['sha256']
          source = root / f'WCAG-Site-PDF-Scanner-v{version}.py'
          assert source.read_bytes() == Path('WCAG_Site_PDF_Scanner.py').read_bytes()
          PY

      - name: Verify GitHub provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GH_REPO"
          done

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/wcag-site-pdf-scanner
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-distributions
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          print-hash: true
