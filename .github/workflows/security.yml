name: Security Scanners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * 5"

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    # All external revisions used by the shared workflow are explicitly allowlisted.
    uses: fusiontechstrategies/FusionTechStrategies/.github/workflows/reusable-security.yml@32d789cfd4c97b27c0b389ac9265d415ddbb78ca
    with:
      # The HTML examples are offline accessibility fixtures, not executable server templates.
      semgrep_targets: |
        WCAG_Site_PDF_Scanner.py
        examples/build_sample_report.py
        scripts
        tests
      semgrep_timeout_seconds: 60
