name: Security Scanners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * 5"

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    # All external revisions used by the shared workflow are explicitly allowlisted.
    uses: fusiontechstrategies/FusionTechStrategies/.github/workflows/reusable-security.yml@f64c8eb98fa6c907e013d158089ea6ab38e91ad7
    with:
      # The HTML examples are offline accessibility fixtures, not executable server templates.
      semgrep_targets: |
        WCAG_Site_PDF_Scanner.py
        examples/build_sample_report.py
        scripts
        tests
