<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community services sample</title>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a href="#main">Skip to services</a>
      <a href="#hours">Office hours</a>
    </nav>
  </header>
  <main id="main">
    <h1>Community services</h1>
    <img src="program-overview.png">
    <p>Use this synthetic page to learn how the scanner records evidence.</p>

    <h2>Request information</h2>
    <form action="/sample-only" method="post">
      <label for="full-name">Full name</label>
      <input id="full-name" name="full-name" autocomplete="name">
      <input id="email" name="email" type="email">
      <button type="submit">Send request</button>
    </form>

    <h3 id="hours">Office hours</h3>
    <p>Monday through Friday, 9:00 a.m. to 5:00 p.m.</p>
  </main>
  <footer>
    <p>Training fixture only. No form data is transmitted.</p>
  </footer>
</body>
</html>
